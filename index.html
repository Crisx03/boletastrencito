<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boletas Trencito</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#2563eb;--ok:#15803d;--warn:#b45309;--bd:#e4e7ec}
@media (prefers-color-scheme:dark){:root{--bg:#101216;--card:#1a1d23;--tx:#eef0f3;--mut:#9aa3b2;--ac:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bd:#2b303a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:90px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:17px}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.mut{color:var(--mut);font-size:14px}
.hidden{display:none}
.tk{text-align:center}
.tk canvas{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--bd)}
video{width:100%;border-radius:12px;background:#000;max-height:46vh;object-fit:cover}
#res{border-radius:14px;padding:18px;text-align:center;margin-top:12px;color:#fff}
#res b{display:block;font-size:26px;margin-bottom:4px}
#res.ok{background:#15803d}#res.bad{background:#b91c1c}#res.warn{background:#b45309}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;margin-bottom:10px}
.stat b{display:block;font-size:26px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}
.tag{font-size:13px;font-weight:600;color:var(--ok)}
.li button{margin-left:8px;padding:5px 9px;font-size:12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>🚂 Boletas del trencito</h1>
<div class="tabs">
  <button data-t="gen" class="on">Generar</button>
  <button data-t="esc">Escanear</button>
  <button data-t="lis">Registro</button>
</div>

<section id="t-gen">
  <div class="card">
    <div class="row">
      <input id="d" inputmode="numeric" placeholder="Desde (ej. 1)">
      <input id="h" inputmode="numeric" placeholder="Hasta (opcional)">
    </div>
    <div class="row" style="margin-top:10px"><button class="btn" id="go">Generar QR</button></div>
    <p class="mut">Se genera un QR por número (001, 002…). Compártelo por WhatsApp o guárdalo como imagen.</p>
  </div>
  <div id="out"></div>
</section>

<section id="t-esc" class="hidden">
  <div class="card">
    <video id="v" playsinline muted class="hidden"></video>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="cam">Abrir cámara</button>
      <button class="btn sec" id="stop">Detener</button>
      <button class="btn sec" id="foto">Tomar foto del QR</button>
      <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
    </div>
    <div class="row" style="margin-top:10px">
      <input id="man" inputmode="numeric" placeholder="O escribe el número (ej. 001)">
      <button class="btn sec" id="ok">Validar</button>
    </div>
    <div id="res" class="hidden"></div>
  </div>
</section>

<section id="t-lis" class="hidden">
  <div class="stat"><b id="s2">0</b><span class="mut">Boletas escaneadas</span></div>
  <div class="card" id="lst"><span class="mut">Aún no hay boletas escaneadas.</span></div>
  <p class="mut">El registro se guarda solo en este dispositivo y navegador.</p>
  <button class="btn sec" id="clr">Borrar todo el registro</button>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const PRE='TREN-', KEY='trencito_escaneos_v1', $=id=>document.getElementById(id);
const pad=s=>String(s).trim().padStart(3,'0');
let stream=null, loop=0, lastCode='', lastAt=0, armed=null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); return true; }catch(e){ return false; } }
const hora=t=>new Date(t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['gen','esc','lis'].forEach(t=>$('t-'+t).classList.toggle('hidden',t!==b.dataset.t));
  if(b.dataset.t!=='esc')stopCam();
  if(b.dataset.t==='lis')renderList();
});

function qrCanvas(n){
  const q=qrcode(0,'M'); q.addData(PRE+n); q.make();
  const c=q.getModuleCount(), m=4, cell=Math.max(4,Math.floor(320/(c+m*2))), w=cell*(c+m*2);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=w+56;
  const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.fillStyle='#000';
  for(let r=0;r<c;r++)for(let k=0;k<c;k++) if(q.isDark(r,k)) x.fillRect((k+m)*cell,(r+m)*cell,cell,cell);
  x.textAlign='center'; x.font='bold 30px system-ui,sans-serif'; x.fillText('Boleta N.º '+n,w/2,w+34);
  return cv;
}
const blobOf=cv=>new Promise(r=>cv.toBlob(r,'image/png'));

async function share(cv,n){
  const blob=await blobOf(cv), name='boleta-'+n+'.png';
  try{
    const f=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Boleta del trencito N.º '+n}); return; }
  }catch(e){ if(e&&e.name==='AbortError')return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

$('go').onclick=()=>{
  const a=parseInt($('d').value,10), b=parseInt($('h').value,10)||a;
  if(!(a>=0)||b<a||b-a>99){ $('out').innerHTML='<p class="mut">Escribe un número válido (máximo 100 boletas por vez).</p>'; return; }
  $('out').innerHTML='';
  for(let i=a;i<=b;i++){
    const n=pad(i), cv=qrCanvas(n), box=document.createElement('div'); box.className='card tk';
    box.appendChild(cv);
    const r=document.createElement('div'); r.className='row'; r.style.cssText='justify-content:center;margin-top:10px';
    const s=document.createElement('button'); s.className='btn'; s.textContent='Compartir por WhatsApp'; s.onclick=()=>share(cv,n);
    r.appendChild(s); box.appendChild(r); $('out').appendChild(box);
  }
};

function show(kind,title,msg){
  const r=$('res'); r.className=kind; r.innerHTML='<b></b><span></span>';
  r.firstChild.textContent=title; r.lastChild.textContent=msg;
  try{ navigator.vibrate&&navigator.vibrate(kind==='ok'?80:[150,80,150]); }catch(e){}
}

function registrar(n){
  const d=load();
  if(d[n]) return show('bad','YA FUE ESCANEADA','Boleta '+n+' usada a las '+hora(d[n].t));
  d[n]={t:Date.now()};
  if(!save(d)) return show('warn','No se pudo guardar','Este navegador no permite guardar datos. Sal del modo privado e intenta de nuevo.');
  show('ok','✔ ADELANTE','Boleta '+n+' registrada');
}

function handle(text){
  const t=String(text).trim(), n=pad(t.startsWith(PRE)?t.slice(PRE.length):t);
  if(!/^\d{3,}$/.test(n)) return show('bad','QR NO RECONOCIDO','Este código no es una boleta del trencito.');
  registrar(n);
}
$('ok').onclick=()=>{ if($('man').value.trim()){ handle($('man').value); $('man').value=''; } };

async function startCam(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return show('warn','Sin cámara','Este navegador no permite usar la cámara aquí. Abre la página con https:// en Chrome o Safari, o usa «Tomar foto del QR».');
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
    catch(e1){ if(e1&&e1.name==='OverconstrainedError') stream=await navigator.mediaDevices.getUserMedia({video:true}); else throw e1; }
    const v=$('v'); v.srcObject=stream; v.classList.remove('hidden'); await v.play();
    const cv=document.createElement('canvas'), x=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(!stream) return;
      if(v.videoWidth){
        const s=Math.min(1,640/v.videoWidth); cv.width=v.videoWidth*s; cv.height=v.videoHeight*s;
        x.drawImage(v,0,0,cv.width,cv.height);
        const c=jsQR(x.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
        if(c&&c.data&&(c.data!==lastCode||Date.now()-lastAt>4000)){ lastCode=c.data; lastAt=Date.now(); handle(c.data); }
      }
      loop=requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ camError(e); }
}
function camError(e){
  const n=e&&e.name, perm='Permiso denegado. Toca el candado junto a la dirección y permite la cámara. Si abriste el enlace desde WhatsApp o Instagram, ábrelo en Chrome o Safari.';
  const m={NotAllowedError:perm,SecurityError:perm,NotFoundError:'Este dispositivo no tiene una cámara disponible.',NotReadableError:'Otra aplicación está usando la cámara. Ciérrala e intenta de nuevo.'};
  show('warn','Sin cámara',(m[n]||'No se pudo abrir la cámara ('+(n||'error')+').')+' También puedes usar «Tomar foto del QR» o escribir el número.');
}
$('foto').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const bmp=await createImageBitmap(f), s=Math.min(1,1000/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas'); cv.width=bmp.width*s; cv.height=bmp.height*s;
    const x=cv.getContext('2d'); x.drawImage(bmp,0,0,cv.width,cv.height);
    const c=jsQR(x.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
    if(c&&c.data) handle(c.data); else show('warn','No se leyó el QR','Acércate más y que el QR salga completo y nítido.');
  }catch(err){ show('warn','Error','No se pudo leer la foto.'); }
};
function stopCam(){ cancelAnimationFrame(loop); if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} $('v').classList.add('hidden'); }
$('cam').onclick=startCam; $('stop').onclick=stopCam;

function renderList(){
  const d=load(), ids=Object.keys(d).sort();
  $('s2').textContent=ids.length;
  const box=$('lst'); box.innerHTML='';
  if(!ids.length){ box.innerHTML='<span class="mut">Aún no hay boletas escaneadas.</span>'; return; }
  ids.forEach(id=>{
    const li=document.createElement('div'); li.className='li';
    const a=document.createElement('span'); a.textContent='N.º '+id;
    const b=document.createElement('span'); b.className='tag'; b.textContent='Escaneada '+hora(d[id].t);
    const u=document.createElement('button'); u.textContent=armed===id?'¿Seguro?':'Reactivar';
    u.onclick=()=>{
      if(armed!==id){armed=id;renderList();setTimeout(()=>{armed=null;renderList();},3000);return;}
      armed=null; const x=load(); delete x[id]; save(x); renderList();
    };
    b.appendChild(u); li.append(a,b); box.appendChild(li);
  });
}
$('clr').onclick=()=>{
  const b=$('clr');
  if(armed!=='all'){ armed='all'; b.textContent='¿Seguro? Toca otra vez'; setTimeout(()=>{armed=null;b.textContent='Borrar todo el registro';},3000); return; }
  armed=null; b.textContent='Borrar todo el registro'; save({}); renderList();
};
</script>
</body>
</html>
